<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceScribe — リアルタイム文字起こし & 翻訳</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap');
  :root{--bg:#0e0e10;--bg2:#18181c;--bg3:#1e1e24;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--text:#e8e8ec;--text2:#888896;--text3:#55555e;--green:#00d97e;--green-dim:rgba(0,217,126,0.12);--red:#ff4f4f;--red-dim:rgba(255,79,79,0.12);--blue:#4f9eff;--blue-dim:rgba(79,158,255,0.10);--amber:#f5a623}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'IBM Plex Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg2)}
  .logo{font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
  .logo-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .logo-sub{font-size:11px;color:var(--text3);font-family:'IBM Plex Mono',monospace}
  .free-badge{font-size:10px;padding:2px 8px;border-radius:3px;background:var(--green-dim);color:var(--green);border:1px solid rgba(0,217,126,0.2);font-family:'IBM Plex Mono',monospace}
  .header-right{display:flex;align-items:center;gap:12px}
  .status-pill{font-size:11px;font-family:'IBM Plex Mono',monospace;padding:3px 10px;border-radius:999px;border:1px solid var(--border2);color:var(--text2);display:flex;align-items:center;gap:6px}
  .status-pill .sdot{width:6px;height:6px;border-radius:50%;background:var(--text3)}
  .status-pill.recording{color:var(--red);border-color:var(--red)}
  .status-pill.recording .sdot{background:var(--red);animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
  .count-badge{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text3)}
  .main{display:grid;grid-template-columns:1fr 260px;flex:1}
  .transcript-panel{border-right:1px solid var(--border);display:flex;flex-direction:column}
  .panel-header{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg2);flex-shrink:0}
  .panel-title{font-size:12px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:0.08em}
  .trans-tag{font-size:10px;padding:1px 7px;border-radius:3px;background:var(--blue-dim);color:var(--blue);border:1px solid rgba(79,158,255,0.2);font-family:'IBM Plex Mono',monospace}
  .translating-badge{font-size:10px;padding:1px 7px;border-radius:3px;background:var(--amber);color:#000;font-family:'IBM Plex Mono',monospace;display:none;animation:fadepulse 1s infinite}
  @keyframes fadepulse{0%,100%{opacity:1}50%{opacity:0.5}}
  .transcript-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:var(--border2) transparent;min-height:0}
  .transcript-body::-webkit-scrollbar{width:4px}
  .transcript-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
  .empty-state{margin:auto;text-align:center;color:var(--text3);font-size:13px;line-height:2;pointer-events:none}
  .empty-state .icon{font-size:32px;margin-bottom:8px;opacity:0.4}
  .entry{border:1px solid var(--border);border-radius:8px;overflow:hidden;animation:slideIn 0.2s ease}
  @keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .entry-orig{padding:10px 14px;background:var(--bg2)}
  .entry-trans{padding:10px 14px;background:var(--blue-dim);border-top:1px solid var(--border)}
  .elabel{font-size:10px;color:var(--text3);font-family:'IBM Plex Mono',monospace;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.06em}
  .etrans-label{font-size:10px;color:var(--blue);font-family:'IBM Plex Mono',monospace;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.06em}
  .etext{font-size:14px;color:var(--text);line-height:1.6}
  .etext.loading{color:var(--text3);font-style:italic}
  .interim-bar{padding:8px 20px;background:rgba(245,166,35,0.06);border-top:1px solid rgba(245,166,35,0.15);font-size:13px;color:var(--amber);font-style:italic;display:none;align-items:center;gap:8px;flex-shrink:0}
  .interim-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);animation:blink 0.8s infinite;flex-shrink:0}
  .ctrl-panel{background:var(--bg2);display:flex;flex-direction:column}
  .ctrl-body{padding:20px 16px;display:flex;flex-direction:column;gap:18px;flex:1}
  .mic-area{display:flex;flex-direction:column;align-items:center;gap:10px}
  .mic-ring{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;transition:transform 0.12s}
  .mic-ring:active{transform:scale(0.93)}
  .mic-ring.idle{background:var(--green)}
  .mic-ring.on{background:var(--red);animation:recpulse 1.6s infinite}
  .mic-ring.busy{background:#444;cursor:wait}
  @keyframes recpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,79,79,0.5)}60%{box-shadow:0 0 0 14px rgba(255,79,79,0)}}
  .mic-lbl{font-size:11px;color:var(--text2)}
  .err-box{font-size:12px;color:var(--red);background:var(--red-dim);border:1px solid rgba(255,79,79,0.2);padding:8px 10px;border-radius:6px;display:none;line-height:1.5}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;font-family:'IBM Plex Mono',monospace}
  .field select{font-size:13px;width:100%;background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:6px;padding:7px 10px;appearance:none;cursor:pointer}
  .field select:focus{outline:none;border-color:var(--green)}
  .sep{border:none;border-top:1px solid var(--border)}
  .toggle-row{display:flex;align-items:center;justify-content:space-between}
  .toggle-label{font-size:13px;color:var(--text)}
  .toggle{position:relative;width:36px;height:20px}
  .toggle input{opacity:0;width:0;height:0}
  .tknob{position:absolute;inset:0;background:var(--bg3);border:1px solid var(--border2);border-radius:999px;cursor:pointer;transition:.22s}
  .tknob:before{content:'';position:absolute;width:14px;height:14px;left:2px;top:2px;background:var(--text3);border-radius:50%;transition:.22s}
  input:checked+.tknob{background:var(--green);border-color:var(--green)}
  input:checked+.tknob:before{transform:translateX(16px);background:#000}
  .clear-btn{font-size:12px;color:var(--text2);background:transparent;border:1px solid var(--border);padding:7px;border-radius:6px;cursor:pointer;width:100%;transition:background 0.15s;font-family:'IBM Plex Sans JP',sans-serif}
  .clear-btn:hover{background:var(--bg3)}
  .info-box{font-size:11px;color:var(--green);background:var(--green-dim);border:1px solid rgba(0,217,126,0.2);padding:8px 10px;border-radius:6px;line-height:1.8}
  #api-status-txt{font-size:10px;color:var(--text3);font-family:'IBM Plex Mono',monospace}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    VoiceScribe
    <span class="logo-sub">v2.2</span>
    <span class="free-badge">完全無料</span>
  </div>
  <div class="header-right">
    <div class="status-pill" id="status-pill">
      <span class="sdot"></span>
      <span id="status-text">待機中</span>
    </div>
    <span class="count-badge" id="count-badge">0 件</span>
  </div>
</header>

<div class="main">
  <div class="transcript-panel">
    <div class="panel-header">
      <span class="panel-title">字幕</span>
      <span class="trans-tag" id="trans-tag">+ 翻訳</span>
      <span class="translating-badge" id="trans-badge">翻訳中...</span>
      <span style="margin-left:auto;font-size:11px;color:var(--text3)" id="count-lbl">0件</span>
    </div>
    <div class="transcript-body" id="transcript">
      <div class="empty-state" id="empty-state">
        <div class="icon">🎙</div>
        マイクボタンを押して<br>録音を開始してください
      </div>
    </div>
    <div class="interim-bar" id="interim-bar">
      <span class="interim-dot"></span>
      <span id="interim-txt"></span>
    </div>
  </div>

  <div class="ctrl-panel">
    <div class="panel-header">
      <span class="panel-title">コントロール</span>
    </div>
    <div class="ctrl-body">
      <div class="mic-area">
        <button class="mic-ring idle" id="mic-btn" onclick="toggleRec()">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <rect x="9" y="2" width="6" height="12" rx="3" fill="white"/>
            <path d="M5 11a7 7 0 0014 0" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
            <line x1="12" y1="18" x2="12" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <line x1="8" y1="22" x2="16" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <span class="mic-lbl" id="mic-lbl">タップして録音開始</span>
      </div>

      <div class="err-box" id="err-box"></div>

      <div class="field">
        <label>入力言語</label>
        <select id="lang-sel" onchange="onLangChange()">
          <option value="ja-JP">日本語</option>
          <option value="en-US">English</option>
        </select>
      </div>

      <hr class="sep">

      <div class="toggle-row">
        <span class="toggle-label">自動翻訳</span>
        <label class="toggle">
          <input type="checkbox" id="auto-trans" checked onchange="onToggleTrans()">
          <span class="tknob"></span>
        </label>
      </div>

      <div class="field" id="target-field">
        <label>翻訳先</label>
        <select id="target-sel">
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
      </div>

      <hr class="sep">
      <button class="clear-btn" onclick="clearAll()">🗑 クリア</button>

      <div class="info-box">
        ✓ 登録不要・完全無料<br>
        ✓ APIキー不要<br>
        <span id="api-status-txt">翻訳エンジン: 自動選択</span>
      </div>
    </div>
  </div>
</div>

<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog=null, running=false, count=0;

function showErr(msg){const e=document.getElementById('err-box');e.textContent=msg;e.style.display='block';setTimeout(()=>e.style.display='none',7000)}
function setApiStatus(msg){document.getElementById('api-status-txt').textContent=msg}

function setUI(state){
  const btn=document.getElementById('mic-btn'),lbl=document.getElementById('mic-lbl'),pill=document.getElementById('status-pill'),st=document.getElementById('status-text');
  btn.className='mic-ring '+(state==='on'?'on':state==='busy'?'busy':'idle');
  lbl.textContent=state==='on'?'タップして停止':'タップして録音開始';
  pill.className='status-pill'+(state==='on'?' recording':'');
  st.textContent=state==='on'?'録音中':'待機中';
  if(state!=='on') document.getElementById('interim-bar').style.display='none';
}

function onLangChange(){
  const lang=document.getElementById('lang-sel').value;
  document.getElementById('target-sel').value=lang.startsWith('ja')?'en':'ja';
}
function onToggleTrans(){
  const on=document.getElementById('auto-trans').checked;
  document.getElementById('trans-tag').style.opacity=on?1:0.3;
  document.getElementById('target-field').style.opacity=on?1:0.4;
}

// エンジン1: MyMemory
async function tryMyMemory(text,src,tgt){
  try{
    const url=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${src}%7C${tgt}`;
    const res=await fetch(url,{signal:AbortSignal.timeout(5000)});
    if(!res.ok) return null;
    const d=await res.json();
    const t=d?.responseData?.translatedText;
    if(t && d.responseStatus===200 && !t.includes('MYMEMORY WARNING') && t!==text){
      setApiStatus('翻訳: MyMemory ✓');
      return t;
    }
    return null;
  }catch{return null}
}

// エンジン2: Lingva (複数インスタンス)
async function tryLingva(text,src,tgt){
  const hosts=['https://lingva.ml','https://translate.plausibility.cloud','https://lingva.garudalinux.org'];
  for(const h of hosts){
    try{
      const res=await fetch(`${h}/api/v1/${src}/${tgt}/${encodeURIComponent(text)}`,{signal:AbortSignal.timeout(5000)});
      if(!res.ok) continue;
      const d=await res.json();
      if(d?.translation){setApiStatus(`翻訳: Lingva ✓`);return d.translation}
    }catch{continue}
  }
  return null;
}

// エンジン3: LibreTranslate (複数インスタンス)
async function tryLibre(text,src,tgt){
  const hosts=['https://libretranslate.com','https://translate.argosopentech.com'];
  for(const h of hosts){
    try{
      const res=await fetch(`${h}/translate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:text,source:src,target:tgt,format:'text'}),signal:AbortSignal.timeout(6000)});
      if(!res.ok) continue;
      const d=await res.json();
      if(d?.translatedText){setApiStatus(`翻訳: LibreTranslate ✓`);return d.translatedText}
    }catch{continue}
  }
  return null;
}

async function doTranslate(text){
  const srcFull=document.getElementById('lang-sel').value;
  const src=srcFull.startsWith('ja')?'ja':'en';
  const tgt=document.getElementById('target-sel').value;
  setApiStatus('翻訳エンジンを試行中...');
  return (await tryMyMemory(text,src,tgt))
      || (await tryLingva(text,src,tgt))
      || (await tryLibre(text,src,tgt))
      || null;
}

async function addEntry(text){
  const tc=document.getElementById('transcript');
  document.getElementById('empty-state').style.display='none';
  const doTrans=document.getElementById('auto-trans').checked;
  const srcLang=document.getElementById('lang-sel').value;
  const srcName=srcLang.startsWith('ja')?'JA':'EN';
  const tgtName=document.getElementById('target-sel').value==='en'?'EN':'JA';
  count++;
  document.getElementById('count-lbl').textContent=count+'件';
  document.getElementById('count-badge').textContent=count+' 件';

  const wrap=document.createElement('div');wrap.className='entry';
  const orig=document.createElement('div');orig.className='entry-orig';
  orig.innerHTML=`<div class="elabel">${srcName}</div><div class="etext">${text}</div>`;
  wrap.appendChild(orig);

  if(doTrans){
    const tr=document.createElement('div');tr.className='entry-trans';
    tr.innerHTML=`<div class="etrans-label">${tgtName}</div><div class="etext loading">翻訳中...</div>`;
    wrap.appendChild(tr);
    tc.appendChild(wrap);tc.scrollTop=tc.scrollHeight;
    document.getElementById('trans-badge').style.display='inline-block';
    const translated=await doTranslate(text);
    document.getElementById('trans-badge').style.display='none';
    const etxt=tr.querySelector('.etext');
    if(translated){etxt.textContent=translated;etxt.classList.remove('loading')}
    else{etxt.textContent='翻訳失敗（ネット接続を確認してください）';etxt.style.color='var(--amber)';etxt.classList.remove('loading')}
  } else {
    tc.appendChild(wrap);
  }
  tc.scrollTop=tc.scrollHeight;
}

function toggleRec(){
  if(!SR){showErr('Chrome推奨: Web Speech APIに非対応です');return}
  if(running){recog&&recog.stop();return}
  startRec();
}

function startRec(){
  const lang=document.getElementById('lang-sel').value;
  recog=new SR();recog.lang=lang;recog.interimResults=true;recog.continuous=true;
  recog.onstart=()=>{running=true;setUI('on')};
  recog.onresult=(e)=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal){const txt=e.results[i][0].transcript.trim();if(txt)addEntry(txt);document.getElementById('interim-bar').style.display='none'}
      else interim+=e.results[i][0].transcript;
    }
    if(interim){document.getElementById('interim-bar').style.display='flex';document.getElementById('interim-txt').textContent=interim}
  };
  recog.onerror=(e)=>{
    if(e.error==='not-allowed')showErr('マイクが拒否されました。アドレスバー左のアイコンから許可してください。');
    else if(e.error!=='no-speech')showErr('エラー: '+e.error);
  };
  recog.onend=()=>{running=false;setUI('idle');document.getElementById('interim-bar').style.display='none'};
  recog.start();
}

function clearAll(){
  document.getElementById('transcript').innerHTML='<div class="empty-state" id="empty-state"><div class="icon">🎙</div>マイクボタンを押して<br>録音を開始してください</div>';
  count=0;document.getElementById('count-lbl').textContent='0件';document.getElementById('count-badge').textContent='0 件';
}

onLangChange();
</script>
</body>
</html>
